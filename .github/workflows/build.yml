name: NDYS Portable EXE Derleyici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # İstediğin zaman manuel tetikleyebilmen için

jobs:
  build:
    runs-on: windows-latest # Derleme işlemi sanal bir Windows bilgisayarda yapılır

    steps:
    - name: Kodları Çek
      uses: actions/checkout@v4

    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: 18 # Kararlı bir Node sürümü

    - name: Gerekli Paketleri Yükle
      run: npm install

    - name: Portable EXE'yi Derle
      run: npm run build

    - name: EXE Dosyasını İndirmeye Sun
      uses: actions/upload-artifact@v4
      with:
        name: NDYS-Programi
        path: dist/*.exe
