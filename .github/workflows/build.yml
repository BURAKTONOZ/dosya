name: DYS Derleme

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları yükle (OCR + PDF okuyucu dahil)
        run: npm install --no-audit --no-fund

      - name: Derle
        run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: OCR dosyaları pakete girmiş mi kontrol et
        shell: bash
        run: |
          base=dist/win-unpacked/resources/app/node_modules
          for f in \
            "$base/@tesseract.js-data/tur/4.0.0_best_int/tur.traineddata.gz" \
            "$base/tesseract.js/dist/worker.min.js" \
            "$base/tesseract.js-core/tesseract-core-simd-lstm.wasm.js" \
            "$base/pdfjs-dist/build/pdf.worker.js"; do
            test -f "$f" || { echo "EKSİK: $f"; exit 1; }
          done
          echo "OCR bileşenleri pakette."

      - uses: actions/upload-artifact@v4
        with:
          name: DYS
          path: dist/DYS.exe

      - name: Sürüm olarak yayınla (yalnızca v* etiketinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DYS.exe
