name: NDYS Portable EXE Derleyici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022 # En stabil derleme ortamı

    steps:
    - name: Kodları Çek
      uses: actions/checkout@v4

    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: 20 # Uyumluluk için Node 20 zorunlu

    - name: Gerekli Paketleri Yükle
      run: npm install

    - name: Portable EXE'yi Derle
      run: npm run build

    - name: EXE Dosyasını İndirmeye Sun
      uses: actions/upload-artifact@v4
      with:
        name: NDYS-Programi
        path: dist/*.exe
