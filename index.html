<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>NDYS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SÜRÜKLENEBİLİR ÜST BAR (Top Bar Modülü) -->
  <header class="top-bar-module">
    <div class="top-logo-area">
      <img src="icon.ico" class="top-logo" alt="Logo" onerror="this.style.display='none'">
      <div class="top-title-text">
        <strong>NDYS</strong> <span style="color:var(--text-muted);">| Numarataj</span>
      </div>
    </div>
    
    <div class="search-module">
      <span>🔍</span>
      <input type="text" id="arama-kutusu" placeholder="Evrak no, konu veya kategori ile arayın... (Ctrl + F)">
    </div>

    <div class="window-controls">
      <div class="profile-info">
        <div class="avatar">👤</div>
        <div class="profile-text">
          <div class="profile-name">Burak TONOZ</div>
          <div class="profile-title">Harita Mühendisi</div>
        </div>
      </div>
      <button class="win-btn" onclick="window.api.minimize()">—</button>
      <button class="win-btn" onclick="window.api.maximize()">🗖</button>
      <button class="win-btn win-close" onclick="window.api.close()">✕</button>
    </div>
  </header>

  <!-- ANA ÇALIŞMA ALANI (Havada Asılı Modüller) -->
  <div id="workspace">
    
    <!-- SOL: AĞAÇ MENÜ -->
    <nav class="glass-module left-menu">
      <div class="menu-title">📂 Klasör Dizini</div>
      <div id="tree-menu" class="tree-menu"></div>
      
      <div class="left-bottom-actions">
        <button class="action-btn" onclick="ayarlarModalAc()">⚙️ Ayarlar</button>
        <button class="action-btn highlight" onclick="modalAc('yeni')">➕ Yeni Evrak</button>
      </div>
    </nav>

    <!-- ORTA: MİNİ A4 KARTLAR -->
    <main class="glass-module center-cards" id="center-module">
      <div class="center-header">
        <h2 id="aktif-baslik">Tüm Arşiv</h2>
      </div>
      <div id="cards-container"></div>
    </main>

    <!-- SAĞ: PDF OKUYUCU (Gizliyken yer kaplamaz) -->
    <aside class="glass-module right-pdf hidden" id="pdf-panel">
      <div class="pdf-header">
        <div class="pdf-title-box">
          <span class="pdf-icon">📄</span>
          <div style="display:flex; flex-direction:column;">
            <span class="pdf-title" id="pdf-view-title">Belge Okuyucu</span>
            <span class="pdf-subtitle">Dijital Önizleme</span>
          </div>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="icon-btn" id="focus-btn" onclick="odakModuGecis()" title="Tam Ekran (Odak Modu)">🔲</button>
          <button class="icon-btn" onclick="document.getElementById('ctx-disa-aktar').click()" title="Bilgisayara İndir">⬇️</button>
          <button class="icon-btn close-btn" onclick="panelKapat()">✕</button>
        </div>
      </div>
      <iframe id="pdf-frame-view" src=""></iframe>
    </aside>

  </div>

  <!-- GİZLİ BUTON (Dışa aktar için IPC tetiği) -->
  <button id="ctx-disa-aktar" style="display:none;"></button>

  <!-- YENİ/DÜZENLE MODALI (Ultra Blur 3D Plaka) -->
  <div id="modal-overlay" class="overlay">
    <div class="modal-box">
      <div class="modal-form">
        <h2 id="modal-baslik">Yeni Evrak</h2>
        <input type="hidden" id="evrak-id">
        <div class="form-group"><label>Kategori</label><select id="evrak-kategori"></select></div>
        <div class="form-group"><label>Evrak Sayısı</label><input type="text" id="evrak-sayisi" placeholder="Örn: 1453"></div>
        <div class="form-group"><label>Evrak Tarihi</label><input type="date" id="evrak-tarihi"></div>
        <div class="form-group"><label>Evrak Konusu</label><input type="text" id="evrak-konusu" placeholder="Belgenin ana konusu"></div>
        <div class="form-group"><label>Kısa Açıklama</label><textarea id="evrak-aciklama" rows="4" placeholder="Evrakın içeriğine dair kısa notlar..."></textarea></div>
        <button class="submit-btn" id="kaydet-btn">Arşive Kaydet</button>
      </div>
      <div class="modal-pdf">
        <div class="pdf-upload-header">
          <span class="pdf-upload-title" id="pdf-upload-title">PDF Yükle</span>
          <label class="custom-file-btn" id="btn-pdf-degistir" style="display:none;">Dosya Seç<input type="file" id="pdf-file-edit" accept="application/pdf"></label>
          <button class="modal-close" onclick="modalKapat()">✕</button>
        </div>
        <div id="drag-zone" class="drag-zone">
          <div class="drag-content">
            <div class="drag-icon">📄</div>
            <div id="drag-text">PDF dosyasını buraya sürükleyin<br>veya tıklayıp seçin</div>
          </div>
          <input type="file" id="pdf-file" accept="application/pdf" style="display:none;">
        </div>
        <iframe id="modal-pdf-preview" src=""></iframe>
      </div>
    </div>
  </div>

  <!-- AYARLAR VE UYARI MODALLARI -->
  <div id="setup-overlay" class="overlay"><div class="setup-box" style="width: 500px;"><h2 id="setup-title">Sistem Ayarları</h2><div class="current-path" id="guncel-yol">Şu anki yol: Seçilmedi</div><button class="submit-btn" style="margin-bottom: 20px; width:100%;" onclick="klasorSecmeIslemi()">Arşiv Klasörünü Değiştir</button><div class="settings-section"><h3>Kategori Yönetimi</h3><div style="display:flex; gap:10px; margin-bottom: 15px;"><input type="text" id="yeni-kategori-input" placeholder="Yeni kategori..." style="flex:1;"><button class="submit-btn" style="padding: 10px 15px;" onclick="kategoriEkle()">Ekle</button></div><div id="kategori-listesi"></div></div><div class="setup-buttons" style="margin-top: 20px;"><button class="modal-close-btn" id="setup-kapat-btn" onclick="ayarlarModalKapat()" style="display:none;">Kapat</button></div></div></div>
  <div id="custom-alert" class="overlay"><div class="setup-box" style="width: 350px; text-align:center;"><h2>Uyarı</h2><p id="alert-message" style="margin-bottom: 25px;"></p><button class="submit-btn" onclick="document.getElementById('custom-alert').classList.remove('show')">Tamam</button></div></div>
  <div id="custom-confirm" class="overlay"><div class="setup-box" style="width: 350px; text-align:center;"><h2>Emin misiniz?</h2><p id="confirm-message" style="margin-bottom: 25px;"></p><div class="setup-buttons"><button class="submit-btn" id="confirm-yes">Evet</button><button class="modal-close-btn" onclick="document.getElementById('custom-confirm').classList.remove('show')">İptal</button></div></div></div>

  <script src="script.js"></script>
</body>
</html>
