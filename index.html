<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>NDYS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- Arkaplan Resmi (Masaüstü Görünümü İçin) -->
  <div id="desktop-bg"></div>
  <div id="drag-region"></div> <!-- Pencereyi taşımak için görünmez alan -->

  <!-- Sağ Üst Profil ve Butonlar -->
  <div class="top-profile-controls">
    <div class="profile-info">
      <div class="avatar">👤</div>
      <div class="profile-text">
        <div class="profile-name">Burak TONOZ</div>
        <div class="profile-title">Harita Mühendisi</div>
      </div>
    </div>
    <div class="window-controls">
      <button class="win-btn" onclick="window.api.minimize()">—</button>
      <button class="win-btn" onclick="window.api.maximize()">🗖</button>
      <button class="win-btn win-close" onclick="window.api.close()">✕</button>
    </div>
  </div>

  <!-- Havada Asılı Arama Çubuğu -->
  <div class="floating-search">
    <span class="search-icon">🔍</span>
    <input type="text" id="arama-kutusu" placeholder="Evrak no, konu veya anahtar kelime ile arayın... (Ctrl + F)">
  </div>

  <!-- ANA YERLEŞİM (3 SÜTUN) -->
  <div id="layout-grid">
    
    <!-- 1. SOL MODÜL (Ağaç Menü) -->
    <nav class="glass-module sidebar">
      <div class="sidebar-header">
        <img src="icon.ico" class="top-logo" alt="NDYS" onerror="this.style.display='none'">
        <div class="top-titles">
          <div class="title-main">Evrak Yönetim Sistemi</div>
          <div class="title-sub">Dijital Arşiv Platformu</div>
        </div>
      </div>
      <div id="tree-menu" class="tree-menu"></div>
      
      <div class="sidebar-footer">
        <div class="status-dot"></div>
        <div class="status-text">Sistem Aktif</div>
      </div>
    </nav>

    <!-- 2. ORTA MODÜL (PDF - Tıklandığında Görünür) -->
    <main class="glass-module pdf-module hidden" id="pdf-panel">
      <div class="pdf-header">
        <div style="display:flex; align-items:center; gap:15px;">
          <div class="pdf-icon">📄</div>
          <div class="pdf-title-area">
            <div class="pdf-title" id="pdf-view-title">Belge Okuyucu</div>
            <div class="pdf-subtitle">PDF Dökümanı</div>
          </div>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="action-icon-btn" onclick="document.getElementById('ctx-disa-aktar').click()" title="Farklı Kaydet">⬇️</button>
          <button class="pdf-close-btn" onclick="panelKapat()">✕</button>
        </div>
      </div>
      <iframe id="pdf-frame-view" src=""></iframe>
    </main>

    <!-- 3. SAĞ MODÜL (Yıllar ve Kartlar) -->
    <aside class="right-column" id="right-column">
      
      <!-- Üst Kısım: Yıllar ve Buton -->
      <div class="glass-module filter-module">
        <div class="filter-title">📅 Yıl Seçimi</div>
        <div id="year-filters" class="year-list"></div>
        <div class="top-actions">
          <button class="icon-btn settings-btn" onclick="ayarlarModalAc()" title="Ayarlar">⚙️️</button>
          <button class="icon-btn add-btn" onclick="modalAc('yeni')" title="Yeni Evrak">➕</button>
        </div>
      </div>

      <!-- Alt Kısım: Evrak Listesi (Yatay Kartlar) -->
      <div class="glass-module list-module">
        <div class="list-header">
          <div class="list-title">📁 Evraklarım</div>
        </div>
        <div id="cards-container"></div>
      </div>
    </aside>

  </div>

  <!-- GİZLİ BUTONLAR (Tıklama için JS'den çağrılır) -->
  <button id="ctx-duzenle" style="display:none;"></button>
  <button id="ctx-sil" style="display:none;"></button>
  <button id="ctx-disa-aktar" style="display:none;"></button>

  <!-- KAYIT / DÜZENLE MODALI -->
  <div id="modal-overlay" class="overlay">
    <div class="modal-box">
      <div class="modal-form">
        <h2 id="modal-baslik">Yeni Evrak</h2>
        <input type="hidden" id="evrak-id">
        <div class="form-group"><label>Kategori</label><select id="evrak-kategori"></select></div>
        <div class="form-group"><label>Evrak Sayısı</label><input type="text" id="evrak-sayisi"></div>
        <div class="form-group"><label>Evrak Tarihi</label><input type="date" id="evrak-tarihi"></div>
        <div class="form-group"><label>Evrak Konusu</label><input type="text" id="evrak-konusu"></div>
        <div class="form-group"><label>Kısa Açıklama</label><textarea id="evrak-aciklama" rows="3"></textarea></div>
        <button class="submit-btn" id="kaydet-btn">Arşive Kaydet</button>
      </div>
      <div class="modal-pdf">
        <div class="pdf-upload-header">
          <span class="pdf-upload-title" id="pdf-upload-title">PDF Yükle</span>
          <label class="custom-file-btn" id="btn-pdf-degistir" style="display:none;">PDF Seç / Değiştir<input type="file" id="pdf-file-edit" accept="application/pdf"></label>
          <button class="modal-close" onclick="modalKapat()">✕</button>
        </div>
        <div id="drag-zone" class="drag-zone">
          <div style="pointer-events: none;"><div style="font-size: 40px; margin-bottom: 10px;">📄</div><div id="drag-text">PDF dosyasını buraya sürükleyin veya seçin</div></div>
          <input type="file" id="pdf-file" accept="application/pdf" style="display:none;">
        </div>
        <iframe id="modal-pdf-preview" src=""></iframe>
      </div>
    </div>
  </div>

  <!-- AYARLAR VE UYARI MODALLARI -->
  <div id="setup-overlay" class="overlay"><div class="setup-box" style="width: 550px;"><h2 id="setup-title">Sistem Ayarları</h2><div class="current-path" id="guncel-yol">Şu anki yol: Seçilmedi</div><button class="submit-btn" style="margin-bottom: 20px;" onclick="klasorSecmeIslemi()">Arşiv Klasörünü Değiştir</button><div class="settings-section"><h3>Kategori Yönetimi</h3><div style="display:flex; gap:10px; margin-bottom: 15px;"><input type="text" id="yeni-kategori-input" placeholder="Yeni kategori..." style="flex:1;"><button class="submit-btn" style="padding: 10px 15px;" onclick="kategoriEkle()">Ekle</button></div><div id="kategori-listesi"></div></div><div class="setup-buttons" style="margin-top: 20px;"><button class="modal-close-btn" id="setup-kapat-btn" onclick="ayarlarModalKapat()" style="display:none;">Kapat</button></div></div></div>
  <div id="custom-alert" class="overlay"><div class="setup-box" style="width: 350px;"><h2>Uyarı</h2><p id="alert-message" style="margin-bottom: 25px;"></p><button class="submit-btn" onclick="document.getElementById('custom-alert').classList.remove('show')">Tamam</button></div></div>
  <div id="custom-confirm" class="overlay"><div class="setup-box" style="width: 350px;"><h2>Emin misiniz?</h2><p id="confirm-message" style="margin-bottom: 25px;"></p><div class="setup-buttons"><button class="submit-btn" id="confirm-yes">Evet</button><button class="modal-close-btn" onclick="document.getElementById('custom-confirm').classList.remove('show')">İptal</button></div></div></div>

  <script src="script.js"></script>
</body>
</html>
